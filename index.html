<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SenceLink Technician</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    145deg,
                    #0876ed 0%,
                    #1768dc 45%,
                    #168fe9 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 18px;
        }

        .page {
            width: 100%;
            max-width: 625px;
            text-align: center;
        }

        .card {
            width: 100%;
            background: #ffffff;

            border-radius: 30px;

            padding: 48px 38px 42px;

            box-shadow:
                0 25px 60px rgba(0, 45, 120, 0.28);

            position: relative;
            overflow: hidden;
        }

        .logo-wrapper {
            width: 145px;
            height: 145px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
        }

        .logo-wrapper img {
            width: 125px;
            height: 125px;

            object-fit: contain;
        }

        h1 {
            color: #112f59;

            font-size: 42px;
            line-height: 1.15;

            font-weight: 800;

            margin-bottom: 18px;
        }

        .subtitle {
            color: #6f7d91;

            font-size: 21px;
            line-height: 1.55;

            max-width: 500px;

            margin: 0 auto 38px;
        }

        .download-btn {
            display: flex;

            width: 100%;
            min-height: 78px;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #1466d4,
                    #0759c8
                );

            color: #ffffff;

            text-decoration: none;

            border-radius: 24px;

            font-size: 25px;
            font-weight: 800;

            box-shadow:
                0 13px 28px rgba(20, 93, 210, 0.30);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .download-btn:active {
            transform: scale(0.98);

            box-shadow:
                0 7px 16px rgba(20, 93, 210, 0.25);
        }

        .download-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 17px 32px rgba(20, 93, 210, 0.34);
        }

        .download-note {
            margin-top: 25px;

            color: #3f9a55;

            font-size: 17px;
            font-weight: 700;
        }

        .divider {
            width: 100%;
            height: 1px;

            background: #e7ebf0;

            margin: 45px 0 30px;
        }

        .footer {
            color: #7c8795;

            font-size: 17px;

            line-height: 1.65;
        }

        .footer span {
            display: block;
        }

        @media (max-width: 600px) {

            body {
                padding: 25px 14px;
            }

            .card {
                border-radius: 27px;

                padding:
                    38px 20px
                    34px;
            }

            .logo-wrapper {
                width: 130px;
                height: 130px;

                margin-bottom: 23px;
            }

            .logo-wrapper img {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 18px;

                line-height: 1.55;

                margin-bottom: 30px;
            }

            .download-btn {
                min-height: 70px;

                border-radius: 21px;

                font-size: 21px;
            }

            .download-note {
                font-size: 15px;
            }

            .footer {
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {

            .card {
                padding:
                    32px 16px
                    30px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .download-btn {
                min-height: 64px;

                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <!-- SenceLink Logo -->
        <div class="logo-wrapper">

            <img
                src="sencelink_logo.png"
                alt="SenceLink Technician"
            >

        </div>


        <!-- Title -->
        <h1>
            SenceLink Technician
        </h1>


        <!-- Description -->
        <p class="subtitle">
            Download the official SenceLink Technician
            app and start managing your rewards.
        </p>


        <!-- DIRECT APK DOWNLOAD -->
        <a
            class="download-btn"
            href="https://github.com/u6969001-pixel/SenceLink-Technician/releases/download/v1.0.0/SenceLink-Technician.apk"
        >
            Download App
        </a>


        <div class="download-note">
            Secure Official APK Download
        </div>


        <div class="divider"></div>


        <div class="footer">
            <span>
                Official SenceLink Technician Application
            </span>

            <span>
                Android APK Download
            </span>
        </div>

    </div>

</div>

</body>
</html>
